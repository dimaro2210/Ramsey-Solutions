kind = "web"
previewPath = "/"
title = "Ramsey Solutions Clone"
version = "1.0.0"
id = "artifacts/ramsey-clone"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22633

[services.development]
run = "pnpm --filter @workspace/ramsey-clone run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ramsey-clone", "run", "build" ]
publicDir = "artifacts/ramsey-clone/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22633"
BASE_PATH = "/"
